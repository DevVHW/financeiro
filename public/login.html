<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Controle Financeiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth">
  <div class="card">
    <h1>Controle Financeiro</h1>
    <p class="sub" id="sub">Entre para ver suas finanças.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="t-login" aria-selected="true">Entrar</button>
      <button type="button" role="tab" id="t-reg" aria-selected="false">Criar conta</button>
    </div>
    <form id="f" novalidate>
      <label id="l-name" hidden>Nome<input name="name" autocomplete="name" maxlength="60"></label>
      <label>E-mail<input name="email" type="email" autocomplete="email" placeholder="voce@email.com"></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password"></label>
      <p class="hint" id="hint" hidden>Use pelo menos 8 caracteres.</p>
      <p class="err" id="err" role="alert"></p>
      <button class="btn pri" id="go" type="submit">Entrar</button>
    </form>
  </div>
</main>
<script src="auth.js"></script>
</body>
</html>
